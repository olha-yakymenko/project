{% extends "base.html" %}

{% block content %}
<h2>Categories</h2>

<a href="{% url 'expenses:category-create' %}">Add Category</a>

<table border="1">
    <caption>Categories</caption>
    <thead>
        <tr>
            <th>Name</th>
            <th>Expenses Count</th> 
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for category in categories_with_expenses %}
        <tr>
            <td>{{ category.name }}</td> 
            <td>{{ category.expenses_count }}</td> 
            <td>
                <a href="{% url 'expenses:category-edit' category.id %}">Edit</a> |
                <a href="{% url 'expenses:category-delete' category.id %}">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No categories available.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
