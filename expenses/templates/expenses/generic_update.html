{% extends "base.html" %}

{% block content %}
  <h2>{% if object %}Edit{% else %}Create{% endif %} Expense</h2>

  <form method="post">
    {% csrf_token %}
    
    {{ form.as_p }}

    <button type="submit">{% if object %}Save changes{% else %}Create{% endif %}</button>
  </form>

  <a href="{% url 'expenses:expense-list' %}">Back to expenses list</a>
{% endblock %}
